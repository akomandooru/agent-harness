name: Agent stop

# Applies the agent-stop label to the originating issue or in-flight PR.
# The label IS the kill-switch signal: the stop-condition checker in
# harness/loop/src/stop-conditions.ts polls KillSwitchPoll.isAgentStopLabelApplied,
# which checks for the presence of this label on the issue or PR.
# This workflow exists so the label can be applied via the GitHub UI
# (Issues → Labels) and the presence is immediately visible to the loop.
#
# CLI equivalent (see scripts/agent-stop.ts):
#   gh issue edit <number> --add-label agent-stop
#   gh pr edit <number> --add-label agent-stop

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  acknowledge-stop:
    name: Acknowledge agent-stop signal
    # Only run when the agent-stop label is the one that was applied.
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent-stop') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'agent-stop')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🛑 **Agent stop signal received.**',
                '',
                'The `agent-stop` label has been applied to this issue.',
                'The in-flight loop will halt at its next stop-condition check and open a PR with reason `kill-switch`.',
                '',
                'To restart the loop after investigating, remove the `agent-stop` label and re-apply `agent-task`.',
              ].join('\n'),
            });

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '🛑 **Agent stop signal received.**',
                '',
                'The `agent-stop` label has been applied to this pull request.',
                'The in-flight loop will halt at its next stop-condition check and record reason `kill-switch`.',
                '',
                'To restart the loop, close this PR, remove the `agent-stop` label from the originating issue, and re-apply `agent-task`.',
              ].join('\n'),
            });
