name: Doc validation

# Runs on every push and pull request that touches docs, config, or scripts.
# Also available as a manual trigger.
#
# Steps:
#   1. validate-config   — validates agent-harness.config.json against its schema
#   2. check-terminology — ensures docs use "AgentCore Managed Harness" (not bare "AgentCore Harness")
#
# Requirements: 1.1

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "post-draft.md"
      - "agent-harness.config.json"
      - "schemas/**"
      - "scripts/**"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "post-draft.md"
      - "agent-harness.config.json"
      - "schemas/**"
      - "scripts/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate config and terminology
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node ────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # ── 3. Install script dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: |
          npm install -g ts-node@10.9.2 typescript@5.5.3
          npm install --no-save ajv@8.17.1 ajv-formats@3.0.1

      # ── 4. Validate agent-harness.config.json ─────────────────────────────────
      - name: Validate config schema
        run: npx ts-node scripts/validate-config.ts

      # ── 5. Check terminology ──────────────────────────────────────────────────
      # Fails if any of README.md, docs/quickstart.md, or post-draft.md contains
      # the bare phrase "AgentCore Harness" (without "Managed").
      # harness-engineering-primer.md and CHANGELOG* are intentionally excluded.
      - name: Check terminology
        run: npx ts-node scripts/check-terminology.ts
