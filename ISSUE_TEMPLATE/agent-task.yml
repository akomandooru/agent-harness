name: Agent task
description: Dispatch a change to the agent harness editor agent
title: "[Agent task] "
labels:
  - agent-task
body:
  - type: input
    id: module_path
    attributes:
      label: Target module path
      description: >
        The CDK module path the agent should edit, relative to the repository
        root (e.g. `modules/fanout`). Must match a path the agent is scoped to.
      placeholder: modules/fanout
    validations:
      required: true

  - type: textarea
    id: change_description
    attributes:
      label: Change description
      description: >
        Describe the change you want the agent to make. Be specific: name the
        construct, resource, or behaviour to add, modify, or remove. The agent
        reads this field verbatim as its task statement.
      placeholder: |
        Add a dead-letter queue to the SQS subscriber so that messages that
        fail processing after 3 attempts are moved to the DLQ instead of being
        lost. Wire a CloudWatch alarm on the DLQ depth.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: >
        Optional. Describe how to verify the change is correct. The agent uses
        this to guide its post-deploy harness checks and to decide when the
        loop has converged. If omitted, the agent relies on the engineering
        harness sensors and the steering file alone.
      placeholder: |
        - The DLQ exists and is KMS-encrypted.
        - The SQS queue's redrive policy points to the DLQ with maxReceiveCount = 3.
        - A CloudWatch alarm named `<stack>-DlqDepth` exists with threshold 1.
        - The post-deploy harness confirms a deliberately poisoned message lands
          in the DLQ within 60 seconds.
    validations:
      required: false
